<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velora — Discover</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins','Segoe UI',Tahoma,sans-serif; }
  body { background: #0a0410; color: #fff; overflow-x: hidden; min-height: 100vh; transition: background 0.3s; }
  body.light { background: #fff5f7; color: #333; }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; }
  a { text-decoration: none; color: inherit; }

  .topbar { position: fixed; top: 0; left: 0; width: 100%; height: 68px; background: rgba(10,4,16,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.07); z-index: 100; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; }
  body.light .topbar { background: rgba(255,245,247,0.9); border-bottom-color: rgba(255,61,110,0.15); }
  .logo { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 800; color: #ff3d6e; }
  .logo-icon { width: 30px; height: 30px; background: linear-gradient(135deg,#ff3d6e,#ff8fa3); border-radius: 50% 50% 50% 0; transform: rotate(-45deg); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(255,61,110,0.5); }
  .logo-icon::after { content: '♥'; transform: rotate(45deg); color: white; font-size: 14px; }
  .topbar-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: white; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.3s; }
  body.light .icon-btn { background: rgba(255,61,110,0.08); border-color: rgba(255,61,110,0.2); color: #ff3d6e; }
  .icon-btn:hover { background: rgba(255,61,110,0.15); border-color: #ff3d6e; transform: scale(1.08); }
  .user-avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg,#ff3d6e,#ff8fa3); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; cursor: pointer; overflow: hidden; }
  .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .logout-btn { padding: 8px 14px; background: transparent; border: 1.5px solid rgba(255,143,163,0.5); color: #ff8fa3; border-radius: 50px; font-size: 12px; font-weight: 600; transition: all 0.3s; }
  .logout-btn:hover { background: rgba(255,143,163,0.15); }

  .app-main { padding: 88px 20px 100px; max-width: 1100px; margin: 0 auto; min-height: 100vh; }
  .page { display: none; animation: pageIn 0.4s ease; }
  .page.active { display: block; }
  @keyframes pageIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
  .page-title { font-size: 26px; font-weight: 800; margin-bottom: 6px; color: white; }
  body.light .page-title { color: #2d1b2e; }
  .page-subtitle { color: rgba(255,255,255,0.55); font-size: 14px; margin-bottom: 24px; }
  body.light .page-subtitle { color: #888; }

  .filter-bar { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-chip { padding: 8px 16px; border-radius: 50px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); font-size: 13px; font-weight: 600; white-space: nowrap; transition: all 0.3s; }
  body.light .filter-chip { background: rgba(255,61,110,0.08); border-color: rgba(255,61,110,0.2); color: #ff3d6e; }
  .filter-chip:hover, .filter-chip.active { background: linear-gradient(135deg,#ff3d6e,#ff6b8a); border-color: transparent; color: white; box-shadow: 0 4px 15px rgba(255,61,110,0.4); }

  .cards-container { display: flex; justify-content: center; align-items: center; min-height: 62vh; position: relative; flex-direction: column; }
  .card-stack { position: relative; width: 100%; max-width: 380px; height: 560px; }
  .profile-card { position: absolute; inset: 0; border-radius: 24px; overflow: hidden; background: linear-gradient(160deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)); border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 25px 70px rgba(0,0,0,0.5); cursor: grab; will-change: transform; user-select: none; }
  .profile-card:active { cursor: grabbing; }
  .profile-card.swiping { transition: none; }
  .profile-card.returning { transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1); }
  .profile-card.flying { transition: transform 0.5s ease-out, opacity 0.5s; opacity: 0; }
  .profile-photo { width: 100%; height: 100%; background: linear-gradient(135deg, #4a0e2e, #2d0a1f); position: relative; overflow: hidden; }
  .profile-photo img { width: 100%; height: 100%; object-fit: cover; }
  .profile-photo .no-photo { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; font-size: 130px; font-weight: 800; color: rgba(255,255,255,0.9); text-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .profile-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 24px 22px; background: linear-gradient(0deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.5) 60%, transparent 100%); }
  .profile-name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .profile-name { font-size: 26px; font-weight: 700; color: white; }
  .verified-badge { width: 22px; height: 22px; background: linear-gradient(135deg,#3b82f6,#6366f1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; color: white; }
  .match-percent { margin-left: auto; padding: 4px 10px; background: rgba(34,197,94,0.2); border: 1px solid rgba(34,197,94,0.4); border-radius: 50px; color: #22c55e; font-size: 12px; font-weight: 700; }
  .profile-meta { color: rgba(255,255,255,0.75); font-size: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .profile-meta .online-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; display: inline-block; }
  .profile-bio { color: rgba(255,255,255,0.85); font-size: 13px; line-height: 1.5; margin-bottom: 10px; max-height: 60px; overflow: hidden; }
  .interests-list { display: flex; gap: 6px; flex-wrap: wrap; }
  .interest-tag { padding: 4px 12px; background: rgba(255,61,110,0.25); border: 1px solid rgba(255,61,110,0.5); border-radius: 50px; font-size: 11px; color: #ff8fa3; font-weight: 600; }
  .swipe-indicator { position: absolute; top: 40px; padding: 8px 20px; border-radius: 12px; font-size: 24px; font-weight: 900; border: 4px solid; opacity: 0; transform: rotate(-15deg); pointer-events: none; transition: opacity 0.15s; }
  .swipe-indicator.like { right: 40px; border-color: #22c55e; color: #22c55e; transform: rotate(15deg); }
  .swipe-indicator.pass { left: 40px; border-color: #ff3d6e; color: #ff3d6e; }
  .swipe-indicator.show { opacity: 1; }
  .photo-nav { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 4px; z-index: 5; }
  .photo-nav-bar { flex: 1; height: 3px; background: rgba(255,255,255,0.3); border-radius: 3px; overflow: hidden; }
  .photo-nav-bar.active { background: white; }
  .photo-prev, .photo-next { position: absolute; top: 0; bottom: 0; width: 40%; z-index: 4; cursor: pointer; }
  .photo-prev { left: 0; }
  .photo-next { right: 0; }

  .card-actions { display: flex; justify-content: center; gap: 16px; margin-top: 24px; }
  .action-big { width: 62px; height: 62px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 26px; transition: all 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
  .action-big.pass { background: rgba(255,255,255,0.08); border: 2px solid rgba(255,61,110,0.4); color: #ff3d6e; }
  .action-big.pass:hover { background: rgba(255,61,110,0.15); transform: scale(1.1); }
  .action-big.super { width: 54px; height: 54px; font-size: 22px; background: linear-gradient(135deg,#3b82f6,#6366f1); color: white; }
  .action-big.super:hover { transform: scale(1.1); box-shadow: 0 12px 40px rgba(59,130,246,0.6); }
  .action-big.like { background: linear-gradient(135deg,#ff3d6e,#ff6b8a); color: white; }
  .action-big.like:hover { transform: scale(1.1); box-shadow: 0 12px 40px rgba(255,61,110,0.6); }

  .empty-state { text-align: center; padding: 60px 20px; }
  .empty-state .emoji { font-size: 80px; margin-bottom: 20px; display: block; }
  .empty-state h3 { font-size: 22px; margin-bottom: 8px; color: white; }
  body.light .empty-state h3 { color: #2d1b2e; }
  .empty-state p { color: rgba(255,255,255,0.55); font-size: 14px; }
  body.light .empty-state p { color: #888; }
  .empty-state button { margin-top: 20px; padding: 12px 28px; background: linear-gradient(135deg,#ff3d6e,#ff6b8a); color: white; border: none; border-radius: 50px; font-weight: 600; font-size: 14px; }

  .matches-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .match-card { background: linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.3s; }
  body.light .match-card { background: white; border-color: rgba(255,61,110,0.15); }
  .match-card:hover { transform: translateY(-4px); border-color: rgba(255,61,110,0.4); box-shadow: 0 15px 40px rgba(255,61,110,0.2); }
  .match-avatar { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg,#ff3d6e,#ff8fa3); color: white; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700; margin: 0 auto 12px; overflow: hidden; }
  .match-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .match-name { font-size: 16px; font-weight: 700; color: white; margin-bottom: 4px; }
  body.light .match-name { color: #2d1b2e; }
  .match-meta { font-size: 13px; color: rgba(255,255,255,0.55); margin-bottom: 12px; }
  body.light .match-meta { color: #888; }
  .match-chat-btn { padding: 8px 20px; background: linear-gradient(135deg,#ff3d6e,#ff6b8a); color: white; border: none; border-radius: 50px; font-size: 13px; font-weight: 600; transition: all 0.3s; }

  .profile-view { max-width: 540px; margin: 0 auto; background: linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)); border: 1px solid rgba(255,255,255,0.12); border-radius: 24px; padding: 32px; }
  body.light .profile-view { background: white; border-color: rgba(255,61,110,0.15); }
  .profile-view .big-avatar { width: 130px; height: 130px; border-radius: 50%; background: linear-gradient(135deg,#ff3d6e,#ff8fa3); color: white; display: flex; align-items: center; justify-content: center; font-size: 50px; font-weight: 800; margin: 0 auto 18px; box-shadow: 0 15px 40px rgba(255,61,110,0.4); overflow: hidden; }
  .profile-view .big-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .profile-view h2 { font-size: 26px; color: white; margin-bottom: 6px; text-align: center; }
  body.light .profile-view h2 { color: #2d1b2e; }
  .profile-view .email-text { color: rgba(255,255,255,0.5); font-size: 14px; margin-bottom: 24px; text-align: center; }
  body.light .profile-view .email-text { color: #888; }
  .profile-details { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .detail-item { padding: 14px; background: rgba(255,255,255,0.04); border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); }
  body.light .detail-item { background: rgba(255,61,110,0.05); border-color: rgba(255,61,110,0.15); }
  .detail-item label { font-size: 11px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 4px; font-weight: 600; }
  body.light .detail-item label { color: #999; }
  .detail-item span { color: white; font-size: 15px; font-weight: 600; }
  body.light .detail-item span { color: #2d1b2e; }
  .bio-box { padding: 16px; background: rgba(255,255,255,0.04); border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); margin-bottom: 16px; }
  body.light .bio-box { background: rgba(255,61,110,0.05); border-color: rgba(255,61,110,0.15); }
  .bio-box label { font-size: 11px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 6px; font-weight: 600; }
  body.light .bio-box label { color: #999; }
  .bio-box p { color: rgba(255,255,255,0.8); font-size: 14px; line-height: 1.6; }
  body.light .bio-box p { color: #444; }
  .edit-btn { width: 100%; padding: 12px; background: linear-gradient(135deg,#ff3d6e,#ff6b8a); color: white; border: none; border-radius: 12px; font-weight: 600; transition: all 0.3s; }
  .edit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,61,110,0.5); }

  .edit-profile-form { display: none; max-width: 540px; margin: 0 auto; background: linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)); border: 1px solid rgba(255,255,255,0.12); border-radius: 24px; padding: 32px; }
  body.light .edit-profile-form { background: white; border-color: rgba(255,61,110,0.15); }
  .edit-profile-form.active { display: block; }
  .edit-profile-form .form-group { margin-bottom: 16px; }
  .edit-profile-form label { display: block; color: rgba(255,255,255,0.75); font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  body.light .edit-profile-form label { color: #666; }
  .edit-profile-form input, .edit-profile-form textarea { width: 100%; padding: 13px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; font-size: 14px; outline: none; transition: border-color 0.3s; }
  body.light .edit-profile-form input, body.light .edit-profile-form textarea { background: #fff5f7; border-color: rgba(255,61,110,0.2); color: #333; }
  .edit-profile-form input:focus, .edit-profile-form textarea:focus { border-color: #ff3d6e; }
  .btn-row { display: flex; gap: 12px; margin-top: 8px; }
  .btn-row button { flex: 1; padding: 13px; border-radius: 12px; border: none; font-weight: 700; font-size: 14px; transition: all 0.3s; }
  .btn-save { background: linear-gradient(135deg,#ff3d6e,#ff6b8a); color: white; }
  .btn-cancel { background: rgba(255,255,255,0.08); color: white; border: 1px solid rgba(255,255,255,0.15); }
  body.light .btn-cancel { background: rgba(255,61,110,0.08); color: #ff3d6e; border-color: rgba(255,61,110,0.2); }

  .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 68px; background: rgba(10,4,16,0.9); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.07); z-index: 100; display: flex; align-items: center; justify-content: space-around; padding: 0 10px; }
  body.light .bottom-nav { background: rgba(255,245,247,0.95); border-top-color: rgba(255,61,110,0.15); }
  .nav-item { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 16px; border-radius: 12px; cursor: pointer; transition: all 0.3s; color: rgba(255,255,255,0.5); font-size: 11px; font-weight: 600; border: none; background: transparent; }
  body.light .nav-item { color: #999; }
  .nav-item .icon { font-size: 22px; line-height: 1; }
  .nav-item.active { color: #ff3d6e; }
  .nav-item.active .icon { transform: scale(1.15); filter: drop-shadow(0 0 8px rgba(255,61,110,0.6)); }
  .nav-item .badge-count { position: absolute; top: 4px; right: 4px; min-width: 16px; height: 16px; padding: 0 4px; background: #ff3d6e; border-radius: 50px; font-size: 10px; color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; }

  .toast { position: fixed; top: 85px; left: 50%; transform: translateX(-50%) translateY(-30px); background: linear-gradient(135deg,#ff3d6e,#ff6b8a); color: white; padding: 14px 26px; border-radius: 50px; font-size: 14px; font-weight: 600; box-shadow: 0 10px 40px rgba(255,61,110,0.5); z-index: 2000; opacity: 0; transition: all 0.4s ease; pointer-events: none; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .match-popup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 3000; display: none; align-items: center; justify-content: center; padding: 20px; }
  .match-popup-overlay.active { display: flex; }
  .match-popup { background: linear-gradient(160deg,#1a0510,#2d0a1f); border: 1px solid rgba(255,61,110,0.4); border-radius: 28px; padding: 40px 30px; max-width: 380px; width: 100%; text-align: center; animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes popIn { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
  .match-popup h2 { font-size: 30px; background: linear-gradient(135deg,#ff3d6e,#ff8fa3); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; font-weight: 800; }
  .match-popup .subtitle { color: rgba(255,255,255,0.7); font-size: 14px; margin-bottom: 24px; }
  .match-popup .avatars { display: flex; justify-content: center; margin-bottom: 24px; }
  .match-popup .avatars .av { width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(135deg,#ff3d6e,#ff8fa3); color: white; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 800; border: 3px solid #1a0510; overflow: hidden; }
  .match-popup .avatars .av img { width: 100%; height: 100%; object-fit: cover; }
  .match-popup .avatars .av:last-child { margin-left: -20px; }
  .match-popup button { width: 100%; padding: 14px; background: linear-gradient(135deg,#ff3d6e,#ff6b8a); color: white; border: none; border-radius: 50px; font-weight: 700; font-size: 15px; margin-top: 8px; }
  .match-popup .btn-explore { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(5px); z-index: 2500; display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.active { display: flex; }
  .modal { background: #1a0510; border: 1px solid rgba(255,255,255,0.15); border-radius: 24px; padding: 30px; width: 100%; max-width: 420px; }
  .modal h3 { color: white; font-size: 22px; margin-bottom: 20px; font-weight: 700; }
  .modal .form-group { margin-bottom: 16px; }
  .modal label { display: block; color: rgba(255,255,255,0.75); font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .modal select, .modal input { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; color: white; font-size: 14px; outline: none; }
  .modal select option { background: #1a0510; }
  .modal .range-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal .btn-row { display: flex; gap: 10px; margin-top: 20px; }
  .modal .btn-row button { flex: 1; padding: 13px; border-radius: 12px; border: none; font-weight: 700; font-size: 14px; }

  @media (max-width: 480px) {
    .card-stack { height: 520px; }
    .profile-name { font-size: 22px; }
    .app-main { padding: 84px 16px 90px; }
    .page-title { font-size: 22px; }
    .topbar { padding: 0 14px; height: 62px; }
    .logo { font-size: 20px; }
    .logout-btn { padding: 6px 10px; font-size: 11px; }
    .bottom-nav { height: 62px; }
    .nav-item { padding: 6px 10px; font-size: 10px; }
    .nav-item .icon { font-size: 20px; }
    .matches-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .match-avatar { width: 60px; height: 60px; font-size: 22px; }
    .action-big { width: 56px; height: 56px; font-size: 24px; }
    .action-big.super { width: 48px; height: 48px; font-size: 20px; }
    .profile-details { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo"><div class="logo-icon"></div>Velora</div>
  <div class="topbar-actions">
    <button class="icon-btn" onclick="toggleTheme()" title="Theme">🌙</button>
    <button class="icon-btn" onclick="openFilterModal()" title="Filters">⚙️</button>
    <div class="user-avatar" id="topAvatar" onclick="switchPage('profile')">?</div>
    <button class="logout-btn" onclick="handleLogout()">Logout</button>
  </div>
</div>

<div class="app-main">
  <div class="page active" id="page-explore">
    <h1 class="page-title">Discover 💫</h1>
    <p class="page-subtitle">Swipe right to like, left to pass</p>
    <div class="filter-bar">
      <button class="filter-chip active" onclick="setQuickFilter('all', this)">All</button>
      <button class="filter-chip" onclick="setQuickFilter('online', this)">🟢 Online</button>
      <button class="filter-chip" onclick="setQuickFilter('verified', this)">✅ Verified</button>
      <button class="filter-chip" onclick="setQuickFilter('nearby', this)">📍 My City</button>
    </div>
    <div class="cards-container" id="cardsContainer">
      <div class="empty-state"><span class="emoji">⏳</span><h3>Loading profiles...</h3></div>
    </div>
  </div>

  <div class="page" id="page-matches">
    <h1 class="page-title">Your Matches 💘</h1>
    <p class="page-subtitle">People who liked you back</p>
    <div id="matchesContainer"><div class="empty-state"><span class="emoji">⏳</span><h3>Loading...</h3></div></div>
  </div>

  <div class="page" id="page-profile">
    <h1 class="page-title">My Profile</h1>
    <p class="page-subtitle">Manage your information</p>
    <div class="profile-view" id="profileView">
      <div class="big-avatar" id="profileAvatar">?</div>
      <h2 id="profileName">Loading...</h2>

  <div class="match-popup">
    <h2>It's a Match! 💖</h2>
    <p class="subtitle">You and <span id="matchName">someone</span> liked each other</p>

  <div class="modal">
    <h3>🔍 Filters</h3>

        <option value="all">All</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="form-group"><label>Age Range</label>
      <div class="range-row">
        <input type="number" id="filterAgeMin" placeholder="Min" value="18">
        <input type="number" id="filterAgeMax" placeholder="Max" value="60">
      </div>
    </div>
    <div class="form-group"><label>City</label><input type="text" id="filterCity" placeholder="Any city"></div>

      <button class="btn-cancel" onclick="resetFilters()">Reset</button>
      <button class="btn-save" onclick="applyFilters()">Apply</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getDatabase, ref, set, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDeXdYVYPzysn55sMNkj-tXYZJzBv7VFD4",
    authDomain: "bigwin-29967.firebaseapp.com",
    databaseURL: "https://bigwin-29967-default-rtdb.firebaseio.com",
    projectId: "bigwin-29967",
    storageBucket: "bigwin-29967.firebasestorage.app",
    messagingSenderId: "628333876092",
    appId: "1:628333876092:web:8e36daac959c0f42154af9"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  window._state = {
    currentUser: null, currentProfile: null, allUsers: {},
    myLikes: {}, myPasses: {}, mySuperLikes: {}, myMatches: {},
    blocked: {}, filteredList: [], swipeIndex: 0,
    filters: { gender: 'all', ageMin: 18, ageMax: 60, city: '' },
    quickFilter: 'all'
  };
  window._db = { auth, db, ref, set, get, update, onValue };
  window._fb = { onAuthStateChanged, signOut };

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'auth.html'; return; }
    const S = window._state;
    S.currentUser = user;

    try {
      await update(ref(db, 'users/' + user.uid), { online: true });
    } catch (e) { console.warn('online status skip:', e.message); }

    const snap = await get(ref(db, 'users/' + user.uid));
    S.currentProfile = snap.val() || {};
    updateProfileUI();
    const av = document.getElementById('topAvatar');
    if (S.currentProfile.photo) av.innerHTML = `<img src="${S.currentProfile.photo}">`;
    else av.textContent = (S.currentProfile.name || 'U').charAt(0).toUpperCase();

    onValue(ref(db, 'users'), (s) => { S.allUsers = s.val() || {}; renderExplore(); });
    onValue(ref(db, 'likes/' + user.uid), (s) => { S.myLikes = s.val() || {}; });
    onValue(ref(db, 'passes/' + user.uid), (s) => { S.myPasses = s.val() || {}; });
    onValue(ref(db, 'superLikes/' + user.uid), (s) => { S.mySuperLikes = s.val() || {}; });
    onValue(ref(db, 'blocked/' + user.uid), (s) => { S.blocked = s.val() || {}; });
    onValue(ref(db, 'matches'), (s) => {
      const all = s.val() || {};
      S.myMatches = {};
      Object.keys(all).forEach(id => { if (all[id].users && all[id].users[user.uid]) S.myMatches[id] = all[id]; });
      renderMatches();
      const badge = document.getElementById('matchesBadge');
      const c = Object.keys(S.myMatches).length;
      if (c) { badge.textContent = c; badge.style.display = 'flex'; } else badge.style.display = 'none';
    });
  });
</script>

<script>
  const S = window._state;

  window.toggleTheme = function() {
    document.body.classList.toggle('light');
    const isLight = document.body.classList.contains('light');
    localStorage.setItem('velora-theme', isLight ? 'light' : 'dark');
    document.querySelector('.icon-btn[title="Theme"]').textContent = isLight ? '☀️' : '🌙';
  };
  if (localStorage.getItem('velora-theme') === 'light') {
    document.body.classList.add('light');
    setTimeout(() => { const b = document.querySelector('.icon-btn[title="Theme"]'); if (b) b.textContent = '☀️'; }, 100);
  }

  window.setQuickFilter = function(type, btn) {
    document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    S.quickFilter = type;
    renderExplore();
  };
  window.openFilterModal = function() { document.getElementById('filterModal').classList.add('active'); };
  window.resetFilters = function() {
    S.filters = { gender: 'all', ageMin: 18, ageMax: 60, city: '' };
    document.getElementById('filterGender').value = 'all';
    document.getElementById('filterAgeMin').value = 18;
    document.getElementById('filterAgeMax').value = 60;
    document.getElementById('filterCity').value = '';
    document.getElementById('filterModal').classList.remove('active');
    renderExplore();
  };
  window.applyFilters = function() {
    S.filters = {
      gender: document.getElementById('filterGender').value,
      ageMin: parseInt(document.getElementById('filterAgeMin').value) || 18,
      ageMax: parseInt(document.getElementById('filterAgeMax').value) || 60,
      city: document.getElementById('filterCity').value.trim().toLowerCase()
    };
    document.getElementById('filterModal').classList.remove('active');
    renderExplore();
  };
  document.getElementById('filterModal')?.addEventListener('click', (e) => {
    if (e.target.id === 'filterModal') e.target.classList.remove('active');
  });

  function calcMatch(me, them) {
    const mi = me.interests || [];
    const ti = them.interests || [];
    if (!mi.length || !ti.length) return 0;
    const common = mi.filter(x => ti.includes(x));
    return Math.round((common.length / Math.max(mi.length, ti.length)) * 100);
  }

  function getEligible() {
    if (!S.currentUser || !S.allUsers) return [];
    const list = [];
    Object.keys(S.allUsers).forEach(uid => {
      if (uid === S.currentUser.uid) return;
      if (S.myLikes[uid] || S.myPasses[uid] || S.mySuperLikes[uid]) return;
      if (S.blocked[uid]) return;
      const u = S.allUsers[uid];
      if (!u || !u.name) return;
      const f = S.filters;
      if (f.gender !== 'all' && u.gender !== f.gender) return;
      if (u.age && (u.age < f.ageMin || u.age > f.ageMax)) return;
      if (f.city && (u.city || '').toLowerCase().indexOf(f.city) === -1) return;
      if (S.quickFilter === 'online' && !u.online) return;
      if (S.quickFilter === 'verified' && !u.verified) return;
      if (S.quickFilter === 'nearby' && S.currentProfile.city && u.city !== S.currentProfile.city) return;
      list.push({ uid, ...u });
    });
    return list;
  }

  function renderExplore() {
    const container = document.getElementById('cardsContainer');
    const profiles = getEligible();
    S.filteredList = profiles;

    if (profiles.length === 0) {
      container.innerHTML = `<div class="empty-state"><span class="emoji">🎉</span><h3>You've seen everyone!</h3><p>Try changing filters or check back later</p><button onclick="resetFilters()">Reset Filters</button></div>`;
      return;
    }

    let html = '<div class="card-stack" id="cardStack">';
    const showCount = Math.min(3, profiles.length);
    for (let i = showCount - 1; i >= 0; i--) {
      const p = profiles[i];
      const scale = 1 - (i * 0.03);
      const translateY = i * 8;
      const opacity = i === 0 ? 1 : 0.85 - i * 0.1;
      const z = 10 - i;
      html += renderCard(p, i === 0, scale, translateY, opacity, z);
    }
    html += '</div>';
    html += `<div class="card-actions">
      <button class="action-big pass" onclick="handlePass('${profiles[0].uid}')" title="Pass">✕</button>
      <button class="action-big super" onclick="handleSuperLike('${profiles[0].uid}')" title="Super Like">⭐</button>
      <button class="action-big like" onclick="handleLike('${profiles[0].uid}')" title="Like">♥</button>
    </div>`;
    container.innerHTML = html;
    attachSwipe();
  }

  function renderCard(p, isTop, scale, translateY, opacity, z) {
    const photos = p.photos && p.photos.length ? p.photos : (p.photo ? [p.photo] : []);
    const photoHTML = photos.length ? `<img src="${photos[0]}" alt="${escapeHtml(p.name)}">` : `<div class="no-photo">${(p.name || '?').charAt(0).toUpperCase()}</div>`;
    const matchPct = S.currentProfile ? calcMatch(S.currentProfile, p) : 0;
    const interests = (p.interests || []).slice(0, 4).map(i => `<span class="interest-tag">${escapeHtml(i)}</span>`).join('');
    return `
      <div class="profile-card" data-uid="${p.uid}" style="transform: translateY(${translateY}px) scale(${scale}); opacity:${opacity}; z-index:${z};" ${isTop ? '' : 'pointer-events:none;'}>
        ${isTop && photos.length > 1 ? `<div class="photo-nav">${photos.map((_, i) => `<div class="photo-nav-bar ${i === 0 ? 'active' : ''}"></div>`).join('')}</div>` : ''}
        <div class="profile-photo">${photoHTML}</div>
        ${isTop && photos.length > 1 ? `<div class="photo-prev" onclick="prevPhoto(event)"></div><div class="photo-next" onclick="nextPhoto(event)"></div>` : ''}
        <div class="swipe-indicator like" id="indLike">LIKE</div>
        <div class="swipe-indicator pass" id="indPass">NOPE</div>
        <div class="profile-overlay">
          <div class="profile-name-row">
            <span class="profile-name">${escapeHtml(p.name || 'Unknown')}${p.age ? ', ' + p.age : ''}</span>
            ${p.verified ? '<span class="verified-badge">✓</span>' : ''}
            ${matchPct > 0 ? `<span class="match-percent">${matchPct}% match</span>` : ''}
          </div>
          <div class="profile-meta">${p.online ? '<span class="online-dot"></span> Online · ' : ''}${escapeHtml(p.gender || '')} · 📍 ${escapeHtml(p.city || 'Unknown')}</div>
          ${p.bio ? `<p class="profile-bio">${escapeHtml(p.bio)}</p>` : ''}
          ${interests ? `<div class="interests-list">${interests}</div>` : ''}
        </div>
      </div>`;
  }

  let currentPhotoIndex = 0;
  window.nextPhoto = function(e) {
    e.stopPropagation();
    const card = document.querySelector('.profile-card[data-uid]');
    if (!card) return;
    const uid = card.dataset.uid;
    const p = S.filteredList.find(x => x.uid === uid);
    if (!p || !p.photos || p.photos.length < 2) return;
    currentPhotoIndex = (currentPhotoIndex + 1) % p.photos.length;
    updateCardPhoto(card, p, currentPhotoIndex);
  };
  window.prevPhoto = function(e) {
    e.stopPropagation();
    const card = document.querySelector('.profile-card[data-uid]');
    if (!card) return;
    const uid = card.dataset.uid;
    const p = S.filteredList.find(x => x.uid === uid);
    if (!p || !p.photos || p.photos.length < 2) return;
    currentPhotoIndex = (currentPhotoIndex - 1 + p.photos.length) % p.photos.length;
    updateCardPhoto(card, p, currentPhotoIndex);
  };
  function updateCardPhoto(card, p, idx) {
    const img = card.querySelector('.profile-photo img');
    if (img) img.src = p.photos[idx];
    card.querySelectorAll('.photo-nav-bar').forEach((b, i) => b.classList.toggle('active', i === idx));
  }

  function attachSwipe() {
    const card = document.querySelector('.profile-card[data-uid]');
    if (!card) return;
    const uid = card.dataset.uid;
    let startX = 0, startY = 0, curX = 0, curY = 0, dragging = false;

    const onStart = (x, y) => { startX = x; startY = y; dragging = true; card.classList.add('swiping'); card.classList.remove('returning'); };
    const onMove = (x, y) => {
      if (!dragging) return;
      curX = x - startX; curY = y - startY;
      card.style.transform = `translate(${curX}px, ${curY}px) rotate(${curX * 0.08}deg)`;
      const il = document.getElementById('indLike'), ip = document.getElementById('indPass');
      if (curX > 40) { il.classList.add('show'); ip.classList.remove('show'); }
      else if (curX < -40) { ip.classList.add('show'); il.classList.remove('show'); }
      else { il.classList.remove('show'); ip.classList.remove('show'); }
    };
    const onEnd = () => {
      if (!dragging) return;
      dragging = false;
      card.classList.remove('swiping');
      const il = document.getElementById('indLike'), ip = document.getElementById('indPass');
      il?.classList.remove('show'); ip?.classList.remove('show');
      if (curX > 100) {
        card.classList.add('flying');
        card.style.transform = `translate(600px, ${curY}px) rotate(30deg)`;
        setTimeout(() => window.handleLike(uid), 300);
      } else if (curX < -100) {
        card.classList.add('flying');
        card.style.transform = `translate(-600px, ${curY}px) rotate(-30deg)`;
        setTimeout(() => window.handlePass(uid), 300);
      } else {
        card.classList.add('returning');
        card.style.transform = '';
        setTimeout(() => card.classList.remove('returning'), 400);
      }
      curX = 0; curY = 0;
    };

    card.addEventListener('mousedown', (e) => { if (e.target.closest('.photo-prev, .photo-next')) return; onStart(e.clientX, e.clientY); });
    document.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
    document.addEventListener('mouseup', onEnd);
    card.addEventListener('touchstart', (e) => { if (e.target.closest('.photo-prev, .photo-next')) return; onStart(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
    card.addEventListener('touchmove', (e) => onMove(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
    card.addEventListener('touchend', onEnd);
  }

  window.handleLike = async function(uid) {
    try {
      const { db, ref, set, get } = window._db;
      await set(ref(db, `likes/${S.currentUser.uid}/${uid}`), true);
      const snap = await get(ref(db, `likes/${uid}/${S.currentUser.uid}`));
      if (snap.exists()) {
        const matchId = [S.currentUser.uid, uid].sort().join('_');
        await set(ref(db, `matches/${matchId}`), { users: { [S.currentUser.uid]: true, [uid]: true }, createdAt: Date.now() });
        showMatchPopup(S.allUsers[uid]?.name || 'Someone', uid);
      } else {
        showToast(`💖 Liked ${S.allUsers[uid]?.name || 'them'}!`);
      }
      renderExplore();
    } catch (e) { console.error(e); showToast('Error'); }
  };

  window.handlePass = async function(uid) {
    try {
      const { db, ref, set } = window._db;
      await set(ref(db, `passes/${S.currentUser.uid}/${uid}`), true);
      renderExplore();
    } catch (e) { console.error(e); }
  };

  window.handleSuperLike = async function(uid) {
    try {
      const { db, ref, set, get } = window._db;
      await set(ref(db, `superLikes/${S.currentUser.uid}/${uid}`), true);
      await set(ref(db, `likes/${S.currentUser.uid}/${uid}`), true);
      const snap = await get(ref(db, `likes/${uid}/${S.currentUser.uid}`));
      if (snap.exists()) {
        const matchId = [S.currentUser.uid, uid].sort().join('_');
        await set(ref(db, `matches/${matchId}`), { users: { [S.currentUser.uid]: true, [uid]: true }, createdAt: Date.now() });
        showMatchPopup(S.allUsers[uid]?.name || 'Someone', uid);
      } else {
        showToast(`⭐ Super Liked ${S.allUsers[uid]?.name || 'them'}!`);
      }
      renderExplore();
    } catch (e) { console.error(e); }
  };

  function renderMatches() {
    const container = document.getElementById('matchesContainer');
    const ids = Object.keys(S.myMatches);
    if (!ids.length) {
      container.innerHTML = `<div class="empty-state"><span class="emoji">💔</span><h3>No matches yet</h3><p>Start liking people in Explore</p></div>`;
      return;
    }
    let html = '<div class="matches-grid">';
    ids.forEach(mid => {
      const pid = Object.keys(S.myMatches[mid].users).find(id => id !== S.currentUser.uid);
      const p = S.allUsers[pid] || {};
      const initial = (p.name || '?').charAt(0).toUpperCase();
      const avatar = p.photo ? `<img src="${p.photo}">` : initial;
      html += `<div class="match-card" onclick="window.location.href='chat.html?match=${mid}'"><div class="match-avatar">${avatar}</div><div class="match-name">${escapeHtml(p.name || 'Unknown')}${p.age ? ', ' + p.age : ''}</div><div class="match-meta">📍 ${escapeHtml(p.city || '')}</div><button class="match-chat-btn">💬 Chat</button></div>`;
    });
    html += '</div>';
    container.innerHTML = html;
  }

  function updateProfileUI() {
    const p = S.currentProfile;
    if (!p) return;
    const av = document.getElementById('profileAvatar');
    if (p.photo) av.innerHTML = `<img src="${p.photo}">`;
    else av.textContent = (p.name || 'U').charAt(0).toUpperCase();
    document.getElementById('profileName').textContent = p.name || 'Unknown';
    document.getElementById('profileEmail').textContent = p.email || '';
    document.getElementById('profileAge').textContent = p.age || '—';
    document.getElementById('profileGender').textContent = p.gender || '—';
    document.getElementById('profileCity').textContent = p.city || '—';
    document.getElementById('profileBio').textContent = p.bio || 'No bio yet.';
    document.getElementById('profileInterests').textContent = (p.interests || []).join(', ') || '—';
  }

  window.showEditProfile = function() {
    document.getElementById('profileView').style.display = 'none';
    document.getElementById('editProfileForm').classList.add('active');
    document.getElementById('editName').value = S.currentProfile.name || '';
    document.getElementById('editAge').value = S.currentProfile.age || '';
    document.getElementById('editCity').value = S.currentProfile.city || '';
    document.getElementById('editInterests').value = (S.currentProfile.interests || []).join(', ');
    document.getElementById('editBio').value = S.currentProfile.bio || '';
  };
  window.hideEditProfile = function() {
    document.getElementById('profileView').style.display = 'block';
    document.getElementById('editProfileForm').classList.remove('active');
  };
  window.saveProfile = async function() {
    const name = document.getElementById('editName').value.trim();
    const age = parseInt(document.getElementById('editAge').value);
    const city = document.getElementById('editCity').value.trim();
    const interests = document.getElementById('editInterests').value.split(',').map(s => s.trim()).filter(Boolean);
    const bio = document.getElementById('editBio').value.trim();
    if (!name || !age || !city) return showToast('Fill required fields');
    try {
      const { db, ref, update } = window._db;
      await update(ref(db, 'users/' + S.currentUser.uid), { name, age, city, interests, bio });
      S.currentProfile = { ...S.currentProfile, name, age, city, interests, bio };
      updateProfileUI();
      hideEditProfile();
      showToast('✅ Profile updated');
    } catch (e) { console.error(e); showToast('Update failed'); }
  };

  window.switchPage = function(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('page-' + page).classList.add('active');
    document.querySelector(`.nav-item[data-page="${page}"]`)?.classList.add('active');
  };

  window.handleLogout = async function() {
    try {
      const { db, ref, update } = window._db;
      const { signOut } = window._fb;
      await update(ref(db, 'users/' + S.currentUser.uid), { online: false });
      await signOut(window._db.auth);
      window.location.href = 'index.html';
    } catch (e) { console.error(e); }
  };

  let toastTimer;
  window.showToast = function(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
  };

  window.showMatchPopup = function(name, uid) {
    document.getElementById('matchName').textContent = name;
    const myAv = document.getElementById('myMatchAv');
    const theirAv = document.getElementById('theirMatchAv');
    if (S.currentProfile.photo) myAv.innerHTML = `<img src="${S.currentProfile.photo}">`;
    else myAv.textContent = (S.currentProfile.name || 'U').charAt(0).toUpperCase();
    const them = S.allUsers[uid] || {};
    if (them.photo) theirAv.innerHTML = `<img src="${them.photo}">`;
    else theirAv.textContent = name.charAt(0).toUpperCase();
    document.getElementById('matchPopup').classList.add('active');
  };
  window.closeMatchPopup = function() { document.getElementById('matchPopup').classList.remove('active'); };

  function escapeHtml(s) { if (s == null) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
