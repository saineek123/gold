
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100e0c">
  <title>Sign In | Velora</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 14px;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at top, #3d2b18, #100e0c 65%);
      color: #f7f2e9;
      font-family: system-ui, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 28px;
      background: #191613;
      border: 1px solid #403323;
      border-radius: 18px;
      box-shadow: 0 20px 65px #0005;
    }

    .brand {
      display: block;
      text-align: center;
      color: #f3d9a4;
      font: bold 34px Georgia, serif;
      letter-spacing: 2px;
      text-decoration: none;
    }

    .subtitle {
      text-align: center;
      color: #aaa198;
      font-size: 13px;
      margin: 10px 0 25px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 22px;
    }

    .tab {
      padding: 11px;
      border: 1px solid #403323;
      border-radius: 9px;
      background: transparent;
      color: #c8bfb2;
      cursor: pointer;
    }

    .tab.active {
      background: #d8b477;
      color: #17110a;
      border-color: #d8b477;
      font-weight: bold;
    }

    label {
      display: block;
      margin: 15px 0 6px;
      font-size: 12px;
      color: #e1d7c8;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #40382d;
      border-radius: 9px;
      background: #100e0c;
      color: white;
      font: inherit;
      outline: none;
    }

    input:focus { border-color: #d8b477; }

    .check {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      color: #c8bfb2;
      font-size: 12px;
      margin-top: 17px;
    }

    .check input {
      width: 16px;
      margin-top: 3px;
      accent-color: #d8b477;
    }

    .submit {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #d8b477;
      color: #17110a;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .submit:disabled { opacity: .6; cursor: wait; }

    .message {
      display: none;
      margin-top: 15px;
      padding: 11px;
      border-radius: 8px;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .message.show { display: block; }
    .message.error { background: #49231f; color: #ffd6d0; }
    .message.success { background: #183c2b; color: #c8f5d9; }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #d8b477;
      text-decoration: none;
      font-size: 13px;
    }

    .hint {
      color: #8f877d;
      font-size: 11px;
      line-height: 1.6;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <main class="card">
    <a href="index.html" class="brand">VELORA</a>
    <p class="subtitle">Discover connections. Build your circle.</p>

    <div class="tabs">
      <button class="tab active" id="loginTab" type="button">Sign in</button>
      <button class="tab" id="registerTab" type="button">Create account</button>
    </div>

    <form id="authForm">
      <div id="nameField" hidden>
        <label for="name">Full name</label>
        <input id="name" type="text" maxlength="70" autocomplete="name">
      </div>

      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email"
             required maxlength="254" placeholder="you@example.com">

      <label for="password">Password</label>
      <input id="password" type="password" required minlength="8"
             autocomplete="current-password" placeholder="At least 8 characters">

      <div id="confirmField" hidden>
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" type="password"
               minlength="8" autocomplete="new-password">
      </div>

      <label class="check" id="ageField" hidden>
        <input id="adult" type="checkbox">
        <span>I confirm that I am 18 or older and agree to the
          <a href="terms.html">Terms</a> and
          <a href="privacy.html">Privacy Policy</a>.
        </span>
      </label>

      <button class="submit" id="submitBtn" type="submit">Sign in</button>
      <button class="back" id="resetBtn" type="button">
        Forgot password?
      </button>

      <div class="message" id="message" role="status" aria-live="polite"></div>
    </form>

    <p class="hint">
      Use your own account. Never share your password or verification codes.
      Age confirmation alone is not identity verification.
    </p>

    <a href="index.html" class="back">← Back to home</a>
  </main>

  <script type="module">
    import {
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      updateProfile,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    import {
      ref,
      get,
      set
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

    import { auth, db } from "./js/firebase.js";

    const form = document.getElementById("authForm");
    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const nameField = document.getElementById("nameField");
    const confirmField = document.getElementById("confirmField");
    const ageField = document.getElementById("ageField");
    const adult = document.getElementById("adult");
    const nameInput = document.getElementById("name");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");
    const submitBtn = document.getElementById("submitBtn");
    const resetBtn = document.getElementById("resetBtn");
    const message = document.getElementById("message");

    let mode = "login";
    let busy = false;

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = "message show " + type;
    }

    function setMode(nextMode) {
      mode = nextMode;
      const registering = mode === "register";

      loginTab.classList.toggle("active", !registering);
      registerTab.classList.toggle("active", registering);

      nameField.hidden = !registering;
      confirmField.hidden = !registering;
      ageField.hidden = !registering;

      nameInput.required = registering;
      confirmPassword.required = registering;
      adult.required = registering;

      password.autocomplete = registering ? "new-password" : "current-password";
      submitBtn.textContent = registering ? "Create account" : "Sign in";
      resetBtn.hidden = registering;
      message.className = "message";
    }

    loginTab.addEventListener("click", () => setMode("login"));
    registerTab.addEventListener("click", () => setMode("register"));

    onAuthStateChanged(auth, (user) => {
      if (user) {
        showMessage("You are signed in. Opening your profile…", "success");
        window.location.replace("profile.html");
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (busy) return;

      const emailValue = email.value.trim().toLowerCase();
      const passwordValue = password.value;

      if (mode === "register") {
        if (nameInput.value.trim().length < 2) {
          showMessage("Please enter your full name.");
          return;
        }

        if (passwordValue !== confirmPassword.value) {
          showMessage("Passwords do not match.");
          return;
        }

        if (!adult.checked) {
          showMessage("You must confirm that you are 18 or older.");
          return;
        }
      }

      busy = true;
      submitBtn.disabled = true;
      showMessage("Please wait…", "success");

      try {
        if (mode === "register") {
          const credential = await createUserWithEmailAndPassword(
            auth, emailValue, passwordValue
          );

          try {
            await updateProfile(credential.user, {
              displayName: nameInput.value.trim()
            });

            await set(ref(db, "users/" + credential.user.uid), {
              uid: credential.user.uid,
              name: nameInput.value.trim(),
              email: emailValue,
              createdAt: Date.now(),
              role: "user",
              status: "active",
              adultDeclaration: true,
              profileComplete: false
            });
          } catch (profileError) {
            await signOut(auth);
            throw new Error(
              "Account was created, but profile setup failed. " +
              "Check Database Rules before trying again."
            );
          }

          showMessage("Account created successfully.", "success");
          window.location.replace("profile.html");
        } else {
          await signInWithEmailAndPassword(auth, emailValue, passwordValue);
          showMessage("Signed in successfully.", "success");
          window.location.replace("profile.html");
        }
      } catch (error) {
        console.error("Authentication error:", error.code, error.message);

        const errors = {
          "auth/email-already-in-use": "This email is already registered.",
          "auth/invalid-email": "Enter a valid email address.",
          "auth/weak-password": "Choose a stronger password.",
          "auth/invalid-credential": "Email or password is incorrect.",
          "auth/user-not-found": "Account not found. Please register.",
          "auth/wrong-password": "Email or password is incorrect.",
          "auth/network-request-failed": "Network error. Check your connection.",
          "auth/too-many-requests": "Too many attempts. Try again later.",
          "auth/operation-not-allowed": "Enable Email/Password in Firebase Authentication."
        };

        showMessage(
          errors[error.code] ||
          error.message ||
          "Something went wrong. Check Firebase settings."
        );
      } finally {
        busy = false;
        submitBtn.disabled = false;
      }
    });

    resetBtn.addEventListener("click", async () => {
      const emailValue = email.value.trim().toLowerCase();

      if (!emailValue) {
        showMessage("Enter your email address first.");
        email.focus();
        return;
      }

      try {
        await sendPasswordResetEmail(auth, emailValue);
        showMessage(
          "If this email is registered, a password reset email will be sent.",
          "success"
        );
      } catch (error) {
        console.error("Password reset error:", error.code);
        showMessage("Could not request a reset. Check your email and try again.");
      }
    });

    setMode("login");
  </script>
</body>
</html>
